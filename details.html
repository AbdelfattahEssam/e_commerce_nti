<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product Details</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="details-body">

  <div class="details-nav">
    <a href="index.html" class="back-link">&larr; Back to Store</a>
  </div>

  <div class="details-card" id="detailsCard">
    <p>Loading product details...</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const productId = urlParams.get('id');
    const container = document.getElementById('detailsCard');

    if (!productId) {
      container.innerHTML = '<p>Product not found.</p>';
    } else {
      fetch(`https://fakestoreapi.com/products/${productId}`)
        .then(res => res.json())
        .then(product => {
          container.innerHTML = `
            <div class="details-image-box">
              <img src="${product.image}" alt="${product.title}" />
            </div>
            <div class="details-info-box">
              <h2>${product.title}</h2>
              <p class="details-desc">${product.description}</p>
              <p class="details-meta"><strong>Category:</strong> ${product.category}</p>
              <p class="details-meta"><strong>Price:</strong> $${product.price.toFixed(2)}</p>
              <p class="details-meta"><strong>Rating:</strong> ${product.rating?.rate || 0} (${product.rating?.count || 0} reviews)</p>
            </div>
          `;
        })
        .catch(err => {
          console.error(err);
          container.innerHTML = '<p>Failed to load product details.</p>';
        });
    }
  </script>
</body>
</html>
